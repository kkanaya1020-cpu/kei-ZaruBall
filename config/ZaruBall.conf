# =========================
# ZaruBall.conf (fixed)
# =========================

# --- Core / SPI / Input ---
CONFIG_SPI=y
CONFIG_INPUT=y

# --- ZMK Pointing ---
CONFIG_ZMK_POINTING=y
# 任意（スムーズスクロール）
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- PMW3610 driver ---
# ※ v0.3 + badjeff/zmk-pmw3610-driver では、以下の「PMW3610_* Kconfig」は存在しないため
#   そのまま残すと "undefined symbol" 警告→ビルド中断になります。
#   代替は devicetree（ZaruBall_right/left.overlay の trackball@0）へ移します。
CONFIG_PMW3610=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=n
# CONFIG_PMW3610_ORIENTATION_90=y
# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=500
# CONFIG_PMW3610_SCROLL_TICK=16
# CONFIG_PMW3610_SMART_ALGORITHM=n
# CONFIG_PMW3610_CPI=1000

# --- Rotary encoder (EC11) ---
# ※ DTSに "compatible = \"alps,ec11\"" の enabled ノードが無い状態でONにすると
#   依存未満足で y→n に落ちて警告になります。
#   まずは警告を止めるためOFF。DTS側を直したら ON に戻してください。
CONFIG_EC11=n
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- NRF / Deprecated symbols ---
# ※ "Deprecated symbol ... is enabled" を避けるため OFF
CONFIG_NFCT_PINS_AS_GPIOS=n
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=n

# --- Power / Sleep ---
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- ZMK Studio ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Split battery reporting ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- RGBLED widget ---
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=500

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=3
